version: "2"

run:
  timeout: 5m
  exclude-dirs:
    - tokenburn
    - circuitbreaker
    - context

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosimple
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - os.Remove
        - os.MkdirAll
