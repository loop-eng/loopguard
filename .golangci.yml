run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosimple

linters-settings:
  errcheck:
    exclude-functions:
      - (io.Closer).Close
      - os.Remove
      - os.MkdirAll

issues:
  exclude-dirs:
    - tokenburn
    - circuitbreaker
    - context
